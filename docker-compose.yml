version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - TINYFISH_API_KEY=${TINYFISH_API_KEY:-}
      - DEBUG=true
    volumes:
      - ./data:/app/data:ro
      - ./backend/app:/app/app:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE=http://localhost:8000/api/v1

  # Optional: Redis for caching (not required for demo)
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"